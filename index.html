<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lily's film</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { margin-top: 0; color: white; }

    .tile {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 21 / 9;
      background: #222;
      color: white;
      text-decoration: none;
    }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .tile:hover img { transform: scale(1.04); }
    .tile span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      text-transform: lowercase;
      letter-spacing: 0.08em;
    }
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    
    h1 { color: white; }

    #banner { margin-bottom: 12px; }
    #banner span { font-size: clamp(24px, 5vw, 56px); }

    #tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    #tiles span { font-size: clamp(13px, 2.2vw, 28px); }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="vid2.mp4" type="video/mp4">
  </video>

  <h1>lily's film</h1>
  <div id="banner"></div>
  <div id="tiles"></div>

  <script src="albums.js"></script>
  <script>
    function makeTile(album) {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = "gallery.html?album=" + album.id;

      const img = document.createElement("img");
      img.src = photoPath(album, album.cover || album.start);   // cover = first photo
      img.alt = album.title;
      img.onerror = () => img.remove();          // grey tile if the photo is missing

      const label = document.createElement("span");
      label.textContent = album.label || album.title;

      a.appendChild(img);
      a.appendChild(label);
      return a;
    }

    document.getElementById("banner").appendChild(makeTile(albums[0]));
    albums.slice(1).forEach(album => {
      document.getElementById("tiles").appendChild(makeTile(album));
    });
  </script>
</body>
</html>
