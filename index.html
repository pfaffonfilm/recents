<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pfaffonfilm</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .grid img { width: 100%; cursor: zoom-in; }

    /* enlarged view */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 94vw; max-height: 94vh; }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 40px;
      padding: 20px;
      cursor: pointer;
      user-select: none;
    }
    #prev { left: 0; }
    #next { right: 0; }
  </style>
</head>
<body>
  <h1>lily's film</h1>
  <div class="grid" id="grid"></div>

  <div id="lightbox">
    <span class="nav" id="prev">&#8249;</span>
    <img id="big" src="" alt="">
    <span class="nav" id="next">&#8250;</span>
  </div>

  <script>
    const folder = "pics/";
    const start = 66960002;  // from 000066960002
    const end = 66960035;    // to 000066960035

    const grid = document.getElementById("grid");
    const lightbox = document.getElementById("lightbox");
    const big = document.getElementById("big");
    const photos = [];
    let current = 0;

    for (let i = start; i <= end; i++) {
      const src = folder + String(i).padStart(12, "0") + ".jpg";
      const img = document.createElement("img");
      img.src = src;
      img.loading = "lazy";
      img.onerror = () => {
        img.remove();
        const n = photos.indexOf(src);
        if (n > -1) photos.splice(n, 1);
      };
      img.onclick = () => open(src);
      photos.push(src);
      grid.appendChild(img);
    }

    function open(src) {
      current = photos.indexOf(src);
      big.src = src;
      lightbox.classList.add("open");
    }
    function close() { lightbox.classList.remove("open"); }
    function step(dir) {
      current = (current + dir + photos.length) % photos.length;
      big.src = photos[current];
    }

    lightbox.onclick = close;
    document.getElementById("prev").onclick = e => { e.stopPropagation(); step(-1); };
    document.getElementById("next").onclick = e => { e.stopPropagation(); step(1); };

    document.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
  </script>
</body>
</html>
