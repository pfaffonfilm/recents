<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lily's film</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    a.back { color: inherit; text-decoration: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .grid img { width: 100%; cursor: zoom-in; }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 94vw; max-height: 94vh; }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 40px;
      padding: 20px;
      cursor: pointer;
      user-select: none;
    }
    #prev { left: 0; }
    #next { right: 0; }
  </style>
</head>
<body>
  <p><a class="back" href="index.html">&larr; back</a></p>
  <h1 id="title"></h1>
  <div class="grid" id="grid"></div>

  <div id="lightbox">
    <span class="nav" id="prev">&#8249;</span>
    <img id="big" src="" alt="">
    <span class="nav" id="next">&#8250;</span>
  </div>

  <script src="albums.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("album");
    const album = albums.find(a => a.id === id) || albums[0];

    document.title = album.title + " | lily's film";
    document.getElementById("title").textContent = album.title;

    const grid = document.getElementById("grid");
    const lightbox = document.getElementById("lightbox");
    const big = document.getElementById("big");
    const photos = [];
    let current = 0;

    for (let n = album.start; n <= album.end; n++) {
      const src = photoPath(album, n);
      const img = document.createElement("img");
      img.src = src;
      img.loading = "lazy";
      img.onerror = () => {
        img.remove();
        const i = photos.indexOf(src);
        if (i > -1) photos.splice(i, 1);
      };
      img.onclick = () => open(src);
      photos.push(src);
      grid.appendChild(img);
    }

    function open(src) {
      current = photos.indexOf(src);
      big.src = src;
      lightbox.classList.add("open");
    }
    function close() { lightbox.classList.remove("open"); }
    function step(dir) {
      current = (current + dir + photos.length) % photos.length;
      big.src = photos[current];
    }

    lightbox.onclick = close;
    document.getElementById("prev").onclick = e => { e.stopPropagation(); step(-1); };
    document.getElementById("next").onclick = e => { e.stopPropagation(); step(1); };
    document.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
  </script>
</body>
</html>
